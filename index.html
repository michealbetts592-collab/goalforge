<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GoalForge</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>GoalForge</h1>
  <p>Find people building the same future.</p>

  <hr>

  <h2>Account</h2>

  <input
    type="email"
    id="email"
    placeholder="Email"
  >
  <br><br>

  <input
    type="password"
    id="password"
    placeholder="Password"
  >
  <br><br>

  <button type="button" id="signupButton">
    Sign Up
  </button>

  <button type="button" id="loginButton">
    Log In
  </button>

  <button type="button" id="logoutButton">
    Log Out
  </button>

  <p id="authMessage">
    Not logged in.
  </p>

  <hr>

  <h2>Your Goal Profile</h2>

  <form id="goalForm">

    <label>Main Goal</label>
    <br>

    <input
      type="text"
      id="goal"
      placeholder="Example: Buy land and live off-grid"
      required
    >

    <br><br>

    <label>Location</label>
    <br>

    <input
      type="text"
      id="location"
      placeholder="Example: Georgia"
      required
    >

    <br><br>

    <label>Budget</label>
    <br>

    <input
      type="number"
      id="budget"
      placeholder="Example: 20000"
      min="0"
      required
    >

    <br><br>

    <label>Timeline</label>
    <br>

    <input
      type="text"
      id="timeline"
      placeholder="Example: Within 2 years"
      required
    >

    <br><br>

    <label>Skills</label>
    <br>

    <input
      type="text"
      id="skills"
      placeholder="Example: Equipment, electrical, farming"
      required
    >

    <br><br>

    <button type="submit">
      Save Goal Profile
    </button>

  </form>

  <p id="message"></p>

  <div id="savedProfile"></div>

  <hr>

  <h2>Potential Matches</h2>

  <button
    type="button"
    id="findMatchesButton"
  >
    Find Matches
  </button>

  <div id="matches"></div>

  <script>

    const SUPABASE_URL =
      "https://kdcpwozangfmmkdftscl.supabase.co";

    const SUPABASE_KEY =
 " sb_publishable_KhVM3RlZoJIYOXGCxaOfJQ_V1lgiH36"

    const db =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const signupButton =
      document.getElementById("signupButton");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const authMessage =
      document.getElementById("authMessage");

    const form =
      document.getElementById("goalForm");

    const message =
      document.getElementById("message");

    const savedProfile =
      document.getElementById("savedProfile");

    const findMatchesButton =
      document.getElementById("findMatchesButton");

    const matchesDiv =
      document.getElementById("matches");


    function setAuthMessage(text) {

      authMessage.textContent = text;

    }


    function renderProfile(
      container,
      profile,
      title
    ) {

      container.innerHTML = "";

      const heading =
        document.createElement("h3");

      heading.textContent = title;

      container.appendChild(heading);


      const fields = [

        ["Goal", profile.goal],

        ["Location", profile.location],

        ["Budget", "$" + profile.budget],

        ["Timeline", profile.timeline],

        ["Skills", profile.skills]

      ];


      fields.forEach(function(field) {

        const p =
          document.createElement("p");

        const strong =
          document.createElement("strong");

        strong.textContent =
          field[0] + ": ";

        p.appendChild(strong);

        p.appendChild(
          document.createTextNode(
            field[1] ?? ""
          )
        );

        container.appendChild(p);

      });

    }


    async function getCurrentUser() {

      const { data, error } =
        await db.auth.getUser();

      if (
        error ||
        !data.user
      ) {

        return null;

      }

      return data.user;

    }


    async function loadOwnProfile() {

      const user =
        await getCurrentUser();

      if (!user) {

        savedProfile.innerHTML = "";

        return;

      }


      const {
        data,
        error
      } = await db

        .from("profiles")

        .select(
          "id, goal, location, budget, timeline, skills"
        )

        .eq(
          "user_id",
          user.id
        )

        .order(
          "created_at",
          {
            ascending: false
          }
        )

        .limit(1);


      if (error) {

        message.textContent =
          "Could not load profile: " +
          error.message;

        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        savedProfile.innerHTML = "";

        return;

      }


      const profile =
        data[0];


      document.getElementById("goal").value =
        profile.goal ?? "";

      document.getElementById("location").value =
        profile.location ?? "";

      document.getElementById("budget").value =
        profile.budget ?? "";

      document.getElementById("timeline").value =
        profile.timeline ?? "";

      document.getElementById("skills").value =
        profile.skills ?? "";


      renderProfile(
        savedProfile,
        profile,
        "Saved Profile"
      );

    }


    signupButton.addEventListener(
      "click",
      async function() {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (
          !email ||
          !password
        ) {

          setAuthMessage(
            "Enter an email and password."
          );

          return;

        }


        const {
          data,
          error
        } = await db.auth.signUp({

          email: email,

          password: password

        });


        if (error) {

          setAuthMessage(
            "Sign-up failed: " +
            error.message
          );

          return;

        }


        if (data.session) {

          setAuthMessage(
            "Account created and logged in."
          );

          await loadOwnProfile();

        } else {

          setAuthMessage(
            "Account created. Check your email to confirm it, then log in."
          );

        }

      }
    );


    loginButton.addEventListener(
      "click",
      async function() {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (
          !email ||
          !password
        ) {

          setAuthMessage(
            "Enter an email and password."
          );

          return;

        }


        const { error } =
          await db.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          setAuthMessage(
            "Login failed: " +
            error.message
          );

          return;

        }


        setAuthMessage(
          "Logged in."
        );


        await loadOwnProfile();

      }
    );


    logoutButton.addEventListener(
      "click",
      async function() {

        const { error } =
          await db.auth.signOut();


        if (error) {

          setAuthMessage(
            "Logout failed: " +
            error.message
          );

          return;

        }


        setAuthMessage(
          "Logged out."
        );


        savedProfile.innerHTML = "";

        matchesDiv.innerHTML = "";

        message.textContent = "";

      }
    );


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const user =
          await getCurrentUser();


        if (!user) {

          message.textContent =
            "You must be logged in to save a profile.";

          return;

        }


        const profile = {

          goal:
            document
              .getElementById("goal")
              .value
              .trim(),

          location:
            document
              .getElementById("location")
              .value
              .trim(),

          budget:
            Number(
              document
                .getElementById("budget")
                .value
            ),

          timeline:
            document
              .getElementById("timeline")
              .value
              .trim(),

          skills:
            document
              .getElementById("skills")
              .value
              .trim()

        };


        const {
          data: existing,
          error: findError
        } = await db

          .from("profiles")

          .select("id")

          .eq(
            "user_id",
            user.id
          )

          .order(
            "created_at",
            {
              ascending: false
            }
          )

          .limit(1);


        if (findError) {

          message.textContent =
            "Could not check existing profile: " +
            findError.message;

          return;

        }


        let saveError = null;


        if (
          existing &&
          existing.length > 0
        ) {

          const result =
            await db

              .from("profiles")

              .update(profile)

              .eq(
                "id",
                existing[0].id
              )

              .eq(
                "user_id",
                user.id
              );


          saveError =
            result.error;

        } else {

          const result =
            await db

              .from("profiles")

              .insert({

                user_id:
                  user.id,

                goal:
                  profile.goal,

                location:
                  profile.location,

                budget:
                  profile.budget,

                timeline:
                  profile.timeline,

                skills:
                  profile.skills

              });


          saveError =
            result.error;

        }


        if (saveError) {

          message.textContent =
            "Save failed: " +
            saveError.message;

          return;

        }


        message.textContent =
          "Goal profile saved to the cloud.";


        renderProfile(
          savedProfile,
          profile,
          "Saved Profile"
        );

      }
    );

function calculateMatchScore(myProfile, otherProfile) {
  function words(value) {
    return String(value || "")
      .toLowerCase()
      .trim()
      .split(/[\s,]+/)
      .filter(Boolean);
  }

  function similarity(a, b, maxPoints) {
    const aWords = words(a);
    const bWords = words(b);

    if (aWords.length === 0 || bWords.length === 0) {
      return 0;
    }

    const shared = aWords.filter(function(word) {
      return bWords.includes(word);
    });

    const uniqueShared = [...new Set(shared)];

    return Math.round(
      (uniqueShared.length /
        Math.max(aWords.length, bWords.length)) *
        maxPoints
    );
  }

  let score = 0;

  score += similarity(
    myProfile.goal,
    otherProfile.goal,
    35
  );

  score += similarity(
    myProfile.location,
    otherProfile.location,
    20
  );

  const myBudget = Number(myProfile.budget);
  const otherBudget = Number(otherProfile.budget);

  if (myBudget > 0 && otherBudget > 0) {
    const difference = Math.abs(
      myBudget - otherBudget
    );

    const largest = Math.max(
      myBudget,
      otherBudget
    );

    score += Math.round(
      (1 - difference / largest) * 15
    );
  }

  score += similarity(
    myProfile.timeline,
    otherProfile.timeline,
    10
  );

  score += similarity(
    myProfile.skills,
    otherProfile.skills,
    20
  );

  return Math.max(
    0,
    Math.min(100, score)
  );
}
    findMatchesButton.addEventListener(
      "click",
      async function() {

        const user =
          await getCurrentUser();


        if (!user) {

          matchesDiv.textContent =
            "Log in first to find matches.";

          return;

        }


        matchesDiv.textContent =
          "Finding matches...";


        const {
          data: profiles,
          error
        } = await db

          .from("profiles")

          .select(
            "user_id, goal, location, budget, timeline, skills"
          );


        if (error) {

          matchesDiv.textContent =
            "Could not load matches: " +
            error.message;

          return;

        }


        const otherProfiles = profiles.filter(
            function(profile) {
              return profile.user_id !== user.id;
            }
          );

          matchesDiv.innerHTML = "";


        if (
          !otherProfiles ||
              otherProfiles.length === 0
        ) {

          matchesDiv.textContent =
            "No other profiles found yet.";

          return;

        }


        otherProfiles.forEach(
          function(
            profile,
            index
          ) {

            const card =
              document.createElement("div");
const score = calculateMatchScore(
  {
    goal: document.getElementById("goal").value,
    location: document.getElementById("location").value,
    budget: document.getElementById("budget").value,
    timeline: document.getElementById("timeline").value,
    skills: document.getElementById("skills").value
  },
  profile
);

const scoreHeading =
  document.createElement("h2");

scoreHeading.textContent =
  score + "% Match";

card.appendChild(scoreHeading);

            renderProfile(
              card,
              profile,
              "Potential Match " +
              (index + 1)
            );


            matchesDiv.appendChild(
              card
            );


            const hr =
              document.createElement("hr");


            matchesDiv.appendChild(
              hr
            );

          }
        );

      }
    );


    db.auth.onAuthStateChange(
      async function(
        event,
        session
      ) {

        if (
          session &&
          session.user
        ) {

          setAuthMessage(
            "Logged in."
          );

        } else {

          setAuthMessage(
            "Not logged in."
          );

        }

      }
    );


    (
      async function startGoalForge() {

        const user =
          await getCurrentUser();


        if (user) {

          setAuthMessage(
            "Logged in."
          );


          await loadOwnProfile();

        }

      }
    )();

  </script>

</body>
</html>
